            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/oauth/introspect:
    post:
      tags:
        - OAuth
      summary: Introspect an AI agent's access token
      operationId: oauthIntrospect
      x-cauthy-flow: false
      description: RFC 7662, for the workspace's server an agent's token was issued for. Holding the token is what lets one ask; it answers only about AI agents' tokens. Available when AI agents are enabled.
      security: []
      parameters:
        - name: X-Tenant-Key
