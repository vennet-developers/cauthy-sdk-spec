    post:
      tags:
        - MemberOrganizations
      summary: Add a member by email
      description: |
        Needs `cauthy:members` manage and a role the caller may assign: one of the
        system's catalog, or, for a system with no catalog, `owner`, `member` or any
        other role word. Only an owner gives `owner`. An account of the workspace
        joins with the role; an address with none gets an account and an invitation. `client_id` and `return_to` choose where the invitation
        sends the person back to (a page of that application).
      operationId: addMyOrganizationMember
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  description: A role of the system's catalog.
                name:
                  type: string
                  description: Display name for a new account.
                locale:
                  type: string
                  enum:
                    - en
                    - es
                  description: Language of the invitation.
                client_id:
                  type: string
                  description: Application the invitation returns to.
                return_to:
                  type: string
                  format: uri
                  description: Page to return to; needs `client_id`, same origin as one of its redirect URIs.
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MyOrganizationMember'
        '400':
          description: Malformed body (`bad_request`); validation of `id`, `email`, `locale`, `client_id`, `return_to`; `unknown_role`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid token, or not a person's session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The role does not allow it (`not_allowed`), the account is not active, or `session_required`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such active organization (`organization_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`already_member`, `user_not_active`, `email_taken` or `already_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Invitations need the installation's public address (`hosted_pages_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
