      summary: OpenID Connect discovery document
      operationId: getOpenIDConfiguration
      x-cauthy-flow: false
      description: The authorization server metadata plus OpenID Connect's fields. The workspace is resolved per request (client_id, X-Tenant-Key or `?tenant=` on authorize), so the document is the same for all of them.
      security: []
      responses:
        '200':
          description: Discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'
  /v1/agents/resources:
