        - $ref: '#/components/parameters/TenantKey'
      responses:
        '200':
          description: The workspace's clients.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total_count
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthClient'
                  total_count:
                    type: integer
        '401':
          description: '`unauthorized`: missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/oauth/clients/{client_id}:
    patch:
      tags:
        - OAuthClients
      summary: Update an OAuth client
      operationId: updateOAuthClient
      x-cauthy-permission: oauth_clients:manage
      description: Changes the name, roles, scopes, the application's address, or what protects the sign-ins through it (`system_proof`, `require_verified_email`). A field left out is left as it is. Every change is audited (`oauth.client.updated`, with `before` and `after` when the protection changed); one that asks less than before emails the workspace's admins. Requires `oauth_clients:manage`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: client_id
          in: path
          required: true
          description: The client's id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientUpdateRequest'
      responses:
        '200':
          description: The client.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthClient'
        '400':
          description: '`bad_request` (not JSON); `validation_error`: an empty name, or an `app_url` that is no application address (`invalid`) or would turn development into production or back (`kind_changed`), or a `system_proof` that is not `off`, `auto` or `required` (`invalid`); `persistent_sessions_moved`: the body sets `allow_persistent_sessions`, now the workspace''s `persistent_sessions`; `system_proof_needs_key`: `system_proof` turned on for an application that does not prove itself with its key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized`: missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/oauth/clients/{client_id}/keys:
    get:
      tags:
        - OAuthClients
      summary: List a client's keys (CAUTHY_KEY)
      operationId: listOAuthClientKeys
      x-cauthy-permission: oauth_clients:manage
      x-cauthy-flow: false
      description: 'The public keys the client authenticates with (`private_key_jwt`, `EdDSA`), newest first: the current one, the previous one of a rotation until it retires, and the revoked ones. Never more than each key''s `kid`. Requires `oauth_clients:manage`.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: client_id
          in: path
          required: true
          description: The client's id.
          schema:
            type: string
      responses:
        '200':
          description: The client's keys.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientKey'
        '404':
          description: 'No such client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized`: missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
        - OAuthClients
      summary: Register a client's key (a new key, or a rotation)
      operationId: addOAuthClientKey
      x-cauthy-permission: oauth_clients:manage
      x-cauthy-flow: false
      description: 'Registers the public half of a `CAUTHY_KEY` made in the browser as the client''s current key; from then on the client may authenticate with it, and needs no secret. Every key that was active keeps working for `keep_previous` (24 hours by default, 7 days, or `none`: refused at once). Cauthy computes the `kid` (RFC 7638) and refuses a key another client of the workspace holds. Audited as `client.key.added`. Requires `oauth_clients:manage`.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: client_id
          in: path
          required: true
          description: The client's id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddClientKeyRequest'
      responses:
        '201':
          description: The key, and the keys it replaced as they stand now.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AddClientKeyResponse'
        '400':
          description: '`bad_request`; `invalid_public_key` (not an Ed25519 public key, or it holds a private member); `invalid_keep_previous`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'No such client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`key_in_use` (the key is already an application''s of the workspace).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized`: missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/oauth/clients/{client_id}/keys/{kid}:
    delete:
      tags:
        - OAuthClients
      summary: Revoke a client's key
      operationId: revokeOAuthClientKey
      x-cauthy-permission: oauth_clients:manage
      x-cauthy-flow: false
      description: 'The key is refused from now on. Revoking the last active key is allowed: `active_keys` 0 says the application can no longer sign in until it gets a new key. Audited as `client.key.revoked`. Requires `oauth_clients:manage`.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: client_id
          in: path
          required: true
          description: The client's id.
          schema:
            type: string
        - name: kid
          in: path
          required: true
          description: The key's `kid`.
          schema:
            type: string
      responses:
        '200':
          description: The key revoked, and how many stay active.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      kid:
                        type: string
                      revoked_at:
                        type: string
                        format: date-time
                      active_keys:
                        type: integer
        '404':
          description: '`key_not_found` (no such key, or already revoked); no such client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized`: missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/oauth/clients/{client_id}/secret:
    delete:
      tags:
        - OAuthClients
      summary: Remove a client's secret
      operationId: removeOAuthClientSecret
      x-cauthy-permission: oauth_clients:manage
      x-cauthy-flow: false
      description: 'Removes the secret (and a rotation''s previous one) of a client that has an active key: the last step of moving an application from its variables to `CAUTHY_KEY`. Audited as `client.secret.removed`. Requires `oauth_clients:manage`.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: client_id
          in: path
          required: true
          description: The client's id.
          schema:
            type: string
      responses:
        '204':
          description: The secret is gone; the client authenticates only with its keys.
        '404':
          description: 'No such client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`no_key`: register a key first, since removing the secret would lock the application out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized`: missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: lacks `oauth_clients:manage`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
