        input_border:
          type: string
        primary:
          type: string
        primary_text:
          type: string
        accent:
          type: string
        error:
          type: string
        error_background:
          type: string
        success:
          type: string
        success_background:
          type: string
        radius:
          type: integer
        button_radius:
          type: integer
        font_family:
          type: string
        fonts:
          type: array
          items:
            $ref: '#/components/schemas/ClientLookFont'
    GoogleOneTapPrompt:
