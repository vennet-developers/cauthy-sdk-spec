          description: Client id and nonce
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GoogleOneTapPrompt'
        '404':
          description: The workspace has no Google sign-in configured (`one_tap_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
