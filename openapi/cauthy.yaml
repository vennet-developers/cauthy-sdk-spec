    post:
      tags:
        - MFA
      summary: Resend the sign-in code by email
      description: |
        Mails another code to the account's address, for a sign-in whose second step is by
        email (`mfa_method: email` in the login response; the first code went with it).
      operationId: mfaSendEmailCode
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFATokenRequest'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent_to:
                        type: string
                        description: The address, masked.
        '400':
          description: '`validation_error` (`mfa_token` missing) or `email_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`token_expired`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`no_email_step` — this sign-in''s second step is the account''s own factor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
