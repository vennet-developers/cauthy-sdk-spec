      x-cauthy-permission: users:manage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: q
          in: query
          required: false
          description: Text searched in the address and name.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Only accounts in this status.
          schema:
            type: string
            enum:
              - active
              - suspended
              - pending_verification
              - anonymous
        - name: limit
          in: query
          required: false
          description: Page size, 1-200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Accounts to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceUser'
                  total_count:
                    type: integer
                    description: Total matching accounts.
        '400':
          description: '`validation_error` on `limit`, `offset` or `status`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized` (no or invalid token), `token_revoked`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: the caller lacks `users:manage`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: '`internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
        - Users
      summary: Invite a new person
      description: Makes an account for the address and emails the invitation that lets the person set their password. If the email cannot be sent the account still stands and `invitation_sent` is false; send it again with `POST /v1/users/{id}/invite`. Emits `user.created`. Requires `users:manage`. A system's own token may call it too.
      operationId: inviteUser
      x-cauthy-permission: users:manage
      security:
        - BearerAuth: []
        - SystemToken: []
      parameters:
        - name: X-Tenant-Key
          in: header
          required: false
          description: Tenant slug. May be left out when the request carries a system's own token, which names its tenant.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvitedUser'
        '400':
          description: '`bad_request`; `validation_error` on `name` (too long), `email`, `locale`, `client_id` or `return_to`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized` (no or invalid token), `token_revoked`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`, `outside_system_scope`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`email_taken`, `already_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: '`internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`hosted_pages_unavailable`: the deployment has no public address for invitations'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/users/{id}:
    delete:
      tags:
        - Users
      summary: Delete a person for good
      description: Removes the account now, with its credentials, roles and memberships; its sessions and tokens end first. The address can sign up again. Nobody can delete themselves. Emits `user.deleted` with `user_id` and `email` in its payload. For an erasure with a grace period that keeps the audit trail under a pseudonym, use `POST /v1/users/{id}/erasure`. Requires `users:delete`. The workspace's owner is never deleted (`owner_protected`).
      operationId: deleteUser
      x-cauthy-permission: users:delete
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: id
          in: path
          required: true
          description: User ID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: '`validation_error`: `id` is not a UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized` (no or invalid token), `token_revoked`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`forbidden`: the caller lacks `users:delete`'
          content:
            application/json:
              schema:
