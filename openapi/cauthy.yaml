            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtocolError'
  /v1/oauth/logout:
    get:
      tags:
        - OAuth
      summary: End the browser's session with Cauthy
      operationId: oauthLogout
      x-cauthy-flow: false
      description: Clears the `cauthy_authz` session and any sign-in in progress. Never redirects to an address the client did not register.
      security:
        - {}
        - HostedSession: []
      parameters:
        - name: client_id
          in: query
          required: false
          description: The client whose registered addresses `post_logout_redirect_uri` is checked against.
          schema:
            type: string
        - name: post_logout_redirect_uri
          in: query
          required: false
          description: Where to send the browser afterwards.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Returned to `post_logout_redirect_uri`.
          schema:
            type: string
        - name: X-Tenant-Key
          in: header
          required: false
          description: Optional. Without it the workspace is the one the client_id (or the token, or the flow) belongs to.
          schema:
            type: string
      responses:
        '302':
