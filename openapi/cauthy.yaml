      responses:
        '200':
          description: Code sent to the new phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MFAPhoneCodeSent'
        '400':
          description: '`validation_error` (`phone` not in international form) or `phone_unavailable` (channel not offered)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized` or `step_up_required` — the current password is missing or wrong'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`phone_disabled` — the workspace''s `allow_phone` is off'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`phone_already_set` — remove the current phone first'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`phone_refused`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`phone_codes_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/mfa/phone/remove:
    post:
      tags:
        - MFA
      summary: Remove the account's phone
      description: Requires the current password (step-up).
      operationId: mfaPhoneRemove
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpPasswordRequest'
      responses:
        '204':
          description: Phone removed
        '401':
          description: '`unauthorized` or `step_up_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`no_phone`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/mfa/phone/verify:
    post:
      tags:
        - MFA
      summary: Confirm the new phone
      description: |
        Takes the code the new phone received and activates it. When it is the account's
        first second step, `recovery_codes` holds the one-time recovery codes (shown once);
        otherwise it is empty.
      operationId: mfaPhoneVerify
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Phone verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        enum:
                          - true
                      recovery_codes:
                        type: array
                        items:
                          type: string
        '400':
          description: '`validation_error` — `code` missing'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`no_phone_pending` — add the phone first'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`invalid_code`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/mfa/push:
    post:
      tags:
        - MFA
      summary: Send a push to approve a sign-in
      description: |
        Sends a push to the account's registered phones. The page shows `number`, which the
        person picks on the phone; listen with `GET /v1/auth/mfa/push/events`, then finish with
        `POST /v1/auth/mfa/challenge` `{"push": true}`.
      operationId: mfaPushSend
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFATokenRequest'
      responses:
        '200':
          description: Push sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      challenge_id:
                        type: string
                      number:
                        type: integer
                        description: The number to show; the person picks it on the phone.
        '400':
          description: '`push_unavailable` (workspace does not approve on the phone) or `validation_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`token_expired`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`no_push_device` — the account has no phone that approves sign-ins'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`push_undelivered` — the push reached none of the phones'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: '`too_many_pushes`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`push_unavailable_now`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/mfa/push/events:
    get:
      tags:
        - MFA
      summary: Stream a sign-in push's status
      description: |
        Server-sent events. Each event is `event: status` with data `{"status": "pending" |
        "approved" | "denied" | "expired"}`; the stream ends after `approved`, `denied`, or
        when the sign-in expires (5 minutes). A comment heartbeat is sent every 15 seconds.
        The mfa_token goes in the `X-MFA-Token` header, never in the URL.
      operationId: mfaPushEvents
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-MFA-Token
          in: header
          required: true
          description: The `mfa_token` from the login response.
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: '`validation_error` (`X-MFA-Token` missing) or `push_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`token_expired`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/mfa/send:
    post:
      tags:
        - MFA
      summary: Send a sign-in code to the phone
      description: |
        Sends a one-time code by SMS or WhatsApp to the account's verified phone, for a
        sign-in waiting on its second step. Submit the code to `POST /v1/auth/mfa/challenge`.
      operationId: mfaSendPhoneCode
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFATokenRequest'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MFAPhoneCodeSent'
        '400':
          description: '`validation_error` (`mfa_token` missing) or `phone_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`token_expired` — the mfa_token is expired or unknown'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`phone_disabled` — the workspace''s `allow_phone` is off'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`no_phone` — the account has no phone for its second step'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`phone_refused` — the provider refused to send to that number'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: '`too_many_codes` — enough codes were sent for this sign-in'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`phone_codes_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/settings:
    get:
      tags:
        - Auth
      summary: Get the workspace's public sign-in settings
      description: |
        What a sign-in or sign-up screen may offer: whether to show "create an
        account", whether a new account needs confirming, the challenge site key,
        phone channels, and so on. Public. Retention numbers and whether an Expo
        token is stored are always zeroed. When the request names an application
        (`X-Cauthy-Client-Id`), `signup` says how its system takes sign-ups and
        `legal` lists what a sign-up there accepts.
      operationId: getPublicAuthSettings
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          schema:
            type: string
          description: The asking application's OAuth client id (an active client of the workspace).
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicAuthSettings'
  /v1/auth/social/providers:
    get:
      tags:
        - Social
      summary: List the workspace's social providers
      description: The active providers, for a sign-in page. Carries no configuration.
      operationId: socialProvidersPublicList
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      responses:
        '200':
          description: Active providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SocialProviderPublic'
                  total_count:
                    type: integer
  /v1/auth/social/{provider}:
    get:
      tags:
        - Social
      summary: Start a social sign-in
      description: |
        Answers the provider's authorization URL to send the browser to. `redirect_uri` must
        be a page of one of the application's allowed origins (or the page named in
        `X-Cauthy-Link-To` by an active client in `X-Cauthy-Client-Id`).
      operationId: socialAuthStart
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: provider
          in: path
          required: true
          description: Social provider id (e.g. `google`).
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          description: Client id of an active application of this workspace.
          schema:
            type: string
        - name: X-Cauthy-Link-To
          in: header
          required: false
          description: The application's own callback page, on one of the client's registered origins.
          schema:
            type: string
      responses:
        '200':
          description: Provider URL to redirect to
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SocialRedirect'
        '400':
          description: '`validation_error` (`redirect_uri` missing) or `invalid_redirect_uri`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`provider_not_configured`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`provider_unavailable` — the provider answers with a form POST this server cannot receive'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/social/{provider}/callback:
    get:
      tags:
        - Social
      summary: Finish a social sign-in
      description: |
        Trades the provider's code for a session (signing up the person when allowed). The
        refresh token is also set in the httpOnly `cauthy_rt` cookie.
      operationId: socialAuthCallback
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          description: The same `redirect_uri` used to start the flow.
          schema:
            type: string
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedTokens'
        '400':
          description: '`validation_error` (`code` missing) or `invalid_state`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: |
            `sso_required` (meta.connection names the SSO connection), `email_not_verified`,
            `email_verification_required`, `signups_disabled`, `account_not_active`, `email_required`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`provider_not_configured`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: '`social_login_failed` — the provider refused or could not be reached'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/sso/connections:
    get:
      tags:
        - SSO
      summary: List the workspace's active SSO connections
      description: Just enough for a sign-in page to draw "Continue with …" buttons. Carries no configuration.
      operationId: ssoConnectionsPublicList
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      responses:
        '200':
          description: Active connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSOConnectionPublic'
                  total_count:
                    type: integer
  /v1/auth/sso/discover:
    post:
      tags:
        - SSO
      summary: Find the SSO connection for an email
      description: |
        Says whether the address's domain signs in through an SSO connection of the workspace
        (`connection` is `null` when not). Never says whether the address has an account.
      operationId: ssoDiscover
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: The matching connection, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      connection:
                        type: object
                        allOf:
                          - $ref: '#/components/schemas/SSOConnectionRef'
                        nullable: true
        '400':
          description: '`validation_error` — an email address is required'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/social/icons/{provider}.svg:
    get:
      tags:
        - Social Providers
      summary: Get a provider's logo
      description: |
        The logo of a catalog provider, as SVG, for a sign-in button. Public: no tenant or auth
        needed, the same for every workspace. Any `custom:` provider (and `custom`) gets a generic
        key. Cached a day (`Cache-Control: public, max-age=86400, immutable`) and loadable from any
        site (`Cross-Origin-Resource-Policy: cross-origin`). Logos from Simple Icons (CC0); see
        `internal/oauth/icons/NOTICE.md`.
      operationId: getSocialIcon
      x-cauthy-flow: false
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider id (`google`, `slack_oidc`, `custom:acme-sso`)
          schema:
            type: string
      responses:
        '200':
          description: The logo
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          description: '`not_found`: no logo for that id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/sso/start:
    post:
      tags:
        - SSO
      summary: Start SSO from an application's server
      description: |
        For an application that draws its own sign-in screen. Give `connection` (slug) or
        `email` (its domain picks the connection), the page to return to, and an S256 PKCE
        challenge. `redirect_uri` must equal `X-Cauthy-Link-To`, on an address the client
        registered. Answers the IdP URL; the flow ends on that page with `?code=`, traded at
        `POST /v1/auth/sso/token`.
      operationId: ssoStart
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Cauthy-Client-Id
          in: header
          required: true
          description: Client id of an active application of this workspace.
          schema:
            type: string
        - name: X-Cauthy-Link-To
          in: header
          required: true
          description: The page the flow returns to; must equal `redirect_uri`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOStartRequest'
      responses:
        '200':
          description: IdP URL to redirect to
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      redirect_url:
                        type: string
                        format: uri
                      connection:
                        type: string
                        description: The connection slug used.
        '400':
          description: '`invalid_client`, `bad_request`, `invalid_redirect_uri`, `validation_error` (`code_challenge`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`connection_inactive`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`sso_not_found` — no such connection, or none answers for the address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/sso/token:
    post:
      tags:
        - SSO
      summary: Trade an SSO code for a session
      description: |
        For the application's server, once per code, within minutes of the flow ending.
        `code_verifier` must match the `code_challenge` given to `POST /v1/auth/sso/start`.
      operationId: ssoToken
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Cauthy-Client-Id
          in: header
          required: true
          description: Client id of the application that started the flow.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOTokenRequest'
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedTokens'
        '400':
          description: '`invalid_client`, `bad_request`, or `invalid_grant` (code invalid, expired, or used)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/webauthn/credentials:
    get:
      tags:
        - Passkeys
      summary: List the user's passkeys
      operationId: webauthnCredentialsList
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      responses:
        '200':
          description: Passkeys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebAuthnCredential'
                  total_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/webauthn/credentials/{id}:
    delete:
      tags:
        - Passkeys
      summary: Delete a passkey
      operationId: webauthnCredentialDelete
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: '`id` is not a UUID (`validation_error`, `invalid_format` on `id`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/webauthn/login/begin:
    post:
      tags:
        - Passkeys
      summary: Begin passkey sign-in
      description: |
        Starts the assertion ceremony; pass `options` to `navigator.credentials.get()`.
        With `email` (and a workspace), the allowed credentials are that user's; without,
        it is a discoverable-credential flow. `X-Tenant-Key` is optional: without it the
        passkey picked names the workspace, and `email` is ignored.
      operationId: webauthnLoginBegin
      x-cauthy-flow: false
      parameters:
        - name: X-Tenant-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          description: Active application whose registered origins join the relying party.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Assertion options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebAuthnCeremonyBegin'
        '403':
          description: '`passkeys_disabled`: the workspace''s `allow_passkeys` is off'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`not_found` — no such user, or the user has no passkeys'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/webauthn/login/finish:
    post:
      tags:
        - Passkeys
      summary: Finish passkey sign-in
      description: |
        Verifies the assertion and issues a session; the refresh token is also set in the
        httpOnly `cauthy_rt` cookie. Without `X-Tenant-Key`, the response includes `tenant`:
        the workspace the passkey belongs to.
      operationId: webauthnLoginFinish
      x-cauthy-flow: false
      parameters:
        - name: X-Tenant-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/IssuedTokens'
                      - type: object
                        properties:
                          tenant:
                            $ref: '#/components/schemas/LoginTenant'
        '400':
          description: '`bad_request`, `session_expired`, `passkey_unknown`, `assertion_invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`clone_detected` — the sign counter went backwards'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`user_suspended` (user or workspace not active) or `sso_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/webauthn/place:
    get:
      tags:
        - Passkeys
      summary: Where a passkey can be used
      description: |
        Tells an application where its person uses a passkey: on its own page at `origin`
        (`here`), and whether Cauthy's hosted page can (`on_cauthy`). Both false: this
        workspace's passkeys cannot be used from that page. An active client in
        `X-Cauthy-Client-Id` adds its registered origins to the relying party.
      operationId: webauthnPlace
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: origin
          in: query
          required: false
          description: The page's origin (scheme://host[:port]).
          schema:
            type: string
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Passkey placement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PasskeyPlace'
        '503':
          description: Passkeys are not set up on this server (`passkeys_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/webauthn/register/begin:
    post:
      tags:
        - Passkeys
      summary: Begin passkey registration
      description: |
        Starts the attestation ceremony for the signed-in user; pass `options` to
        `navigator.credentials.create()`. Requires the current password (step-up).
      operationId: webauthnRegisterBegin
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  description: The current password (step-up).
                kind:
                  type: string
                  enum:
                    - security_key
                    - device
                    - ''
                  description: Steers the browser; empty offers all kinds.
      responses:
        '200':
          description: Attestation options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebAuthnCeremonyBegin'
        '400':
          description: '`validation_error` — `kind` is not security_key, device, or empty'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: '`unauthorized` or `step_up_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/webauthn/register/finish:
    post:
      tags:
        - Passkeys
      summary: Finish passkey registration
      operationId: webauthnRegisterFinish
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebAuthnFinishRequest'
                - type: object
                  properties:
                    nickname:
                      type: string
                      description: A name for the passkey.
      responses:
        '201':
          description: Passkey registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebAuthnCredential'
        '400':
          description: '`bad_request`, `session_expired`, `attestation_invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/connect/self:
    get:
      tags:
        - Connect
      summary: Who the calling application is (CAUTHY_KEY)
      description: 'Asked by an application with its own token (the `client_credentials` token it gets with its `CAUTHY_KEY` assertion, the same token it sends as `X-Cauthy-System-Token`): its workspace, its system, its client and the client people sign in through, the origins of its registered return addresses (development first), the return path and the key it last proved itself with. `X-Tenant-Key` is optional with a system''s token. Cacheable for five minutes (`Cache-Control: private, max-age=300`) and revalidated with its `ETag` (`If-None-Match` answers 304). Nothing in it is secret.'
      operationId: getConnectSelf
      x-cauthy-flow: false
      security:
        - SystemToken: []
      parameters:
        - name: X-Tenant-Key
          in: header
          required: false
          description: Optional with a system's own token, which names its workspace.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the last answer.
          schema:
            type: string
      responses:
        '200':
          description: Who the application is.
          headers:
            ETag:
              description: Strong validator of the answer.
              schema:
                type: string
            Cache-Control:
              description: '`private, max-age=300`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConnectSelf'
        '304':
          description: Unchanged since the `ETag` sent in `If-None-Match`.
        '401':
          description: "`unauthorized`: no token, or an invalid one."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: "`not_a_system_token`: a person's token; `outside_system_scope`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: "`client_inactive`: the application's client is gone or turned off."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/oauth/authorize:
    get:
      tags:
        - OAuth
      summary: Authorization endpoint (code + PKCE)
      operationId: oauthAuthorize
      x-cauthy-flow: false
      description: 'Starts a sign-in. Without a session, Cauthy shows its own sign-in page and later returns to `redirect_uri` with a code. A caller that sends a valid `Authorization: Bearer` access token of the workspace, or a browser holding the `cauthy_authz` session cookie, gets the code at once (unless `prompt=login` or `prompt=create`). Every client must send `response_type=code` (RFC 6749 §4.1.1). A client_id of an AI agent also requires `resource` (RFC 8707) and PKCE S256.'
      security:
        - {}
        - HostedSession: []
        - BearerAuth: []
      parameters:
        - name: client_id
          in: query
          required: true
          description: The client's id.
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description: Must be one the client registered.
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          description: 'Always `code`. Missing or anything else: `unsupported_response_type`, sent back to the redirect_uri once the client and redirect_uri are known to be genuine.'
          schema:
            type: string
            enum:
              - code
        - name: state
          in: query
          required: false
          description: Opaque value returned to the redirect URI.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Space-separated scopes. Default `openid profile email`.
          schema:
            type: string
        - name: code_challenge
          in: query
          required: false
          description: PKCE challenge. Required for public clients and agents.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          description: Only `S256`.
          schema:
            type: string
            enum:
              - S256
        - name: prompt
          in: query
          required: false
          description: '`none` fails with login_required when not signed in; `login` always shows the page; `create` opens the sign-up page.'
          schema:
            type: string
            enum:
              - none
              - login
              - create
        - name: login_hint
          in: query
          required: false
          description: An email address to fill in on the sign-in page.
          schema:
            type: string
        - name: ui_locales
          in: query
          required: false
          description: Language of the pages.
          schema:
            type: string
        - name: method
          in: query
          required: false
          description: '`passkey`: the page asks for a passkey and nothing else.'
          schema:
            type: string
            enum:
              - passkey
        - name: resource
          in: query
          required: false
          description: 'AI agents: the address of the workspace''s server to access (RFC 8707).'
          schema:
            type: string
        - name: tenant
          in: query
          required: false
          description: The workspace's slug, when the client_id alone should not decide it (a browser cannot send X-Tenant-Key).
          schema:
            type: string
        - name: X-Tenant-Key
          in: header
          required: false
          description: Optional. Without it the workspace is the one the client_id (or the token, or the flow) belongs to.
          schema:
            type: string
      responses:
        '302':
          description: To the hosted sign-in (`/v1/oauth/login?rid=…`, or `/v1/oauth/signup` for `prompt=create`) with the `cauthy_authz_req` cookie set; or to `redirect_uri` with `error` (`unsupported_response_type`, `invalid_request`, `login_required`, `invalid_target`), `error_description` and `state`.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        '303':
          description: 'Already signed in (session cookie or Bearer token): to `redirect_uri` with `code` and `state`. For an AI agent not yet allowed, to the consent page.'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        '400':
          description: Missing client_id or redirect_uri, unknown client, redirect URI not registered, or PKCE required. Shown here, never sent to the redirect URI.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: The request could not be saved.
          content:
            text/html:
              schema:
                type: string
  /v1/oauth/clients:
    get:
      tags:
        - OAuthClients
      summary: List OAuth clients
      operationId: listOAuthClients
      x-cauthy-permission: oauth_clients:manage
      description: Requires `oauth_clients:manage`.
      security:
        - BearerAuth: []
