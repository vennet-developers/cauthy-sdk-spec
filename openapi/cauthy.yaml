  /v1/auth/mfa/phone:
    post:
      tags:
        - MFA
      summary: Add a phone for the second step
      description: |
        Sets the account's phone and sends it a code; confirm with
        `POST /v1/auth/mfa/phone/verify`. Requires the current password (step-up).
