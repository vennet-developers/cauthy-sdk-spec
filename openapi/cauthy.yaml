  /v1/auth/look/{client_id}:
    get:
      tags:
        - Auth
      summary: Get an application's form look
      description: |
        The colours, corners and typeface of an application's theme, for the forms
        it draws on its own pages (@cauthyhq/react, @cauthyhq/js). Public. Cached for 5 minutes
        (`Cache-Control: public, max-age=300`). Fields the theme does not set are absent.
      operationId: getClientLook
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
