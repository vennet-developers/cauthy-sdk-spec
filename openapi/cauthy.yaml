  /v1/oauth/revoke:
    post:
      tags:
        - OAuth
      summary: Revoke a refresh token
      operationId: oauthRevoke
      x-cauthy-flow: false
      description: 'Ends the session a client holds, by its refresh token: what an application calls when the person signs out of it.'
      security:
        - {}
        - ClientSecretBasic: []
      parameters:
        - name: X-Tenant-Key
          in: header
          required: false
          description: Optional. Without it the workspace is the one the client_id (or the token, or the flow) belongs to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The refresh token to revoke (an AI agent: its access or refresh token).'
                client_id:
                  type: string
                  description: The client's id. May come in HTTP Basic instead.
                client_secret:
                  type: string
                  description: The client's secret, for a confidential client. May come in HTTP Basic instead.
                client_assertion_type:
                  type: string
                  description: '`urn:ietf:params:oauth:client-assertion-type:jwt-bearer` for private_key_jwt (RFC 7523): how a client with a registered key (CAUTHY_KEY) authenticates here.'
                client_assertion:
                  type: string
                  description: The signed JWT that authenticates the client (`aud` is the token endpoint).
      responses:
        '200':
          description: Always `{}` once the client is authenticated, whether or not the token was live (RFC 7009).
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '`invalid_request`: the body is not a form.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtocolError'
        '401':
          description: '`invalid_client`: client authentication failed (RFC 7009 §2.2.1). Carries `WWW-Authenticate: Basic` when the client sent HTTP Basic.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtocolError'
  /v1/oauth/token:
    post:
      tags:
        - OAuth
      summary: Token endpoint
      operationId: oauthToken
      x-cauthy-flow: false
      description: |-
        Grants: `authorization_code` (with `code_verifier` for PKCE), `refresh_token` (rotating: the answer carries the next refresh token), `client_credentials` (service clients; with a secret or a `private_key_jwt` assertion), and token exchange (`urn:ietf:params:oauth:grant-type:token-exchange`, RFC 8693) for a workspace server's client. Client authentication: `client_secret_post`, `client_secret_basic`, `private_key_jwt`, or none for public clients and AI agents. `private_key_jwt` takes RS256 (keys the client publishes at its `jwks_uri`) or EdDSA (a key registered on the client: CAUTHY_KEY). A client with a registered key and no secret is confidential: every grant it uses, and `/v1/oauth/revoke`, need its assertion. The workspace is the client's own; X-Tenant-Key is optional.

        Every error comes as RFC 6749 §5.2 `{error, error_description}` with `Cache-Control: no-store`, never in Cauthy's error envelope. An `invalid_client` for a client that sent HTTP Basic carries `WWW-Authenticate: Basic`.
      security:
        - {}
        - ClientSecretBasic: []
      parameters:
        - name: X-Tenant-Key
          in: header
          required: false
          description: Optional. Without it the workspace is the one the client_id (or the token, or the flow) belongs to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - client_credentials
                    - urn:ietf:params:oauth:grant-type:token-exchange
                  description: The grant.
                client_id:
                  type: string
                  description: The client's id. May come in HTTP Basic instead, or be read from client_assertion.
                client_secret:
                  type: string
                  description: client_secret_post. May come in HTTP Basic instead.
                client_assertion_type:
                  type: string
                  description: '`urn:ietf:params:oauth:client-assertion-type:jwt-bearer` for private_key_jwt (RFC 7523).'
                client_assertion:
                  type: string
                  description: The signed JWT that authenticates the client.
                code:
                  type: string
                  description: 'authorization_code: the code received at the redirect URI.'
                redirect_uri:
                  type: string
                  description: 'authorization_code: the same redirect_uri sent to authorize.'
                code_verifier:
                  type: string
                  description: 'authorization_code: the PKCE verifier.'
                refresh_token:
                  type: string
                  description: 'refresh_token: the current refresh token (used once).'
                resource:
                  type: string
                  description: 'AI agents and exchange: the server the token is for (RFC 8707).'
                scope:
                  type: string
                  description: 'AI agents (refresh) and exchange: the scopes asked for.'
                subject_token:
                  type: string
                  description: 'Exchange: the agent''s access token held by the calling server.'
                subject_token_type:
                  type: string
                  description: 'Exchange: the subject token''s type.'
                requested_token_type:
                  type: string
                  description: 'Exchange: the token type wanted.'
                audience:
                  type: string
                  description: 'Exchange: the server the token is for, instead of resource.'
              required:
                - grant_type
      responses:
        '200':
          description: Tokens. No envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: 'A refused grant: `invalid_grant`, `invalid_request`, `unauthorized_client`, `unsupported_grant_type`, `invalid_target`, `invalid_scope` (agents and exchange); `invalid_request` also for a body that is not a form.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtocolError'
        '401':
          description: '`invalid_client`: unknown client or failed client authentication.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtocolError'
        '500':
          description: '`server_error`: unexpected error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtocolError'
