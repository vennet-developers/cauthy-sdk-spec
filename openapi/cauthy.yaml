          type: integer
          format: int64
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
          description: Always `none`.
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        software_id:
          type: string
        software_version:
          type: string
    OAuthUserInfo:
      type: object
      required:
        - sub
        - tid
        - roles
      properties:
        sub:
          type: string
          description: The user's (or service client's) id.
        tid:
          type: string
          description: The workspace's id.
        email:
          type: string
        email_verified:
          type: boolean
        email_verify_by:
          type: string
          format: date-time
          description: When an unconfirmed address stops being enough (UTC).
        restricted:
          type: boolean
          description: 'Past that moment: the account reads and does not write.'
        name:
          type: string
        locale:
          type: string
        roles:
          type: array
          items:
            type: string
        anonymous:
          type: boolean
          description: A guest session; carries no email.
    OAuthOrganizationMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        system:
          type: string
        name:
          type: string
        kind:
          type: string
        external_id:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        members:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          type: string
          description: The person's role in it.
        permissions:
          type: array
          items:
            type: string
          description: What the role may do, when the system keeps a catalog of roles.
        denied:
          type: array
          items:
            type: string
          description: What is explicitly denied.
        conditional:
          type: array
          items:
            $ref: '#/components/schemas/ConditionalPermission'
          description: What holds only under a condition, to ask Cauthy about with `POST /v1/oauth/organizations/{id}/check`; present (possibly empty) whenever `permissions` is.
    OAuthClient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
          description: What a service client's tokens assert.
        is_public:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        system:
          type: string
          description: Set on a client that is a system's own identity.
        jwks_uri:
          type: string
        system_import:
          type: boolean
        system_proof:
          type: string
          enum: ['off', auto, required]
          description: 'Whether only the application''s own server may sign people in through the client: every sign-in must carry its system''s proof (`X-Cauthy-System-Token`), so a copied client id is useless on its own. `auto` turns into a requirement after the first sign-in that carried it.'
        require_verified_email:
          type: boolean
          description: No token is issued through the client to a person whose email is unconfirmed.
        system_proof_required_at:
          type: string
          format: date-time
          description: Under `auto`, when the first sign-in that carried the proof turned it on. Absent until then.
    OAuthClientUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Cannot be empty.
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        app_url:
          type: string
          description: The application's address (https://…, or http://localhost while developing, no path). The client's return addresses move to it, keeping their paths; its id and secret stay. A development address stays a development one and production stays production (`kind_changed`).
          example: https://app.example.com
        allow_persistent_sessions:
          type: boolean
          deprecated: true
          description: 'No longer a client''s: refused with `400 persistent_sessions_moved`. "Keep me signed in" is the workspace''s `persistent_sessions` (`PUT /v1/settings/auth`).'
        system_proof:
          type: string
          enum: ['off', auto, required]
          description: 'Only the application''s own server may sign people in through the client. `auto` waits for the first sign-in that carries the proof and then requires it; `required` requires it at once; `off` turns it off. Turning it on needs an application that proves itself with its key (`400 system_proof_needs_key`). Turning it off emails the workspace''s admins.'
        require_verified_email:
          type: boolean
          description: No token to a person whose email is unconfirmed. Turning it off emails the workspace's admins.
    OAuthThemeFont:
      type: object
      required:
        - family
        - url
      properties:
        family:
          type: string
        url:
          type: string
          description: https address of a .woff2 file.
        weight:
          type: string
          description: '`400`, or `100 900` for a variable font. A number is accepted too.'
        style:
          type: string
          enum:
            - normal
            - italic
    OAuthThemeLink:
      type: object
      required:
        - label
        - url
      properties:
        label:
          type: string
        url:
          type: string
    OAuthThemeTexts:
      type: object
      properties:
        heading:
          type: string
          description: Replaces "Sign in".
        subheading:
          type: string
          description: Replaces "to continue to …".
        panel:
          type: array
          items:
            type: string
          description: Messages of the split layout's panel (5 at most).
        links:
          type: array
          items:
            $ref: '#/components/schemas/OAuthThemeLink'
          description: Links at the foot of the split layout (4 at most).
    OAuthClientTheme:
      type: object
      additionalProperties: false
      description: 'How an application looks on Cauthy''s hosted pages. Every field is optional; one left out keeps Cauthy''s look. Colours: #rgb, #rrggbb, #rrggbbaa, rgb(…) or rgba(…).'
      properties:
        background:
          type: string
          description: The page.
        surface:
          type: string
          description: The card and inputs.
        text:
          type: string
        text_muted:
          type: string
        border:
          type: string
        input_background:
          type: string
        input_border:
          type: string
        primary:
          type: string
          description: The main button.
        primary_text:
          type: string
        accent:
          type: string
          description: Links and the focus ring.
        error:
          type: string
        error_background:
          type: string
        success:
          type: string
        success_background:
          type: string
        radius:
          type: integer
          minimum: 0
          maximum: 40
          description: Cards and inputs, in pixels.
        button_radius:
          type: integer
          minimum: 0
          maximum: 40
          description: Buttons, in pixels.
        font_family:
          type: string
          description: A CSS font-family list.
        fonts:
          type: array
          items:
            $ref: '#/components/schemas/OAuthThemeFont'
        logo_url:
          type: string
          description: An https image shown where "Cauthy" is.
        layout:
          type: string
          enum:
            - card
            - split
          description: '`card` (default) or `split`.'
        panel_colors:
          type: array
          items:
            type: string
          description: 'Split layout: one to four colours the panel blends.'
        panel_text:
          type: string
          description: 'Split layout: the colour of the panel''s text.'
        panel_icon_url:
          type: string
          description: 'Split layout: an image over the panel.'
        texts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OAuthThemeTexts'
          description: The application's own words, by language (`en`, `es`).
        tokens:
          type: object
          additionalProperties:
            type: string
          description: Stackmyth tokens (`--sm-*`) laid over the values above.
    LoginTenant:
      type: object
      description: A workspace a login resolved to.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: acme-corp
        name:
          type: string
          example: Acme Corporation
