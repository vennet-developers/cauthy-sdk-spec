          type: string
          description: Present when `source` is `role`.
          example: accountant
        kind:
          type: string
          example: '*'
        resource:
          type: string
          example: invoices
        action:
          type: string
          example: approve
        effect:
          type: string
          enum:
            - allow
            - deny
        condition:
          type: string
          description: Present when the rule has one.
    PermissionDecision:
      type: object
      required:
        - allowed
        - reason
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          example: 'allowed by role accountant: invoices:approve'
        rule:
          $ref: '#/components/schemas/PermissionRule'
    MemberAttributes:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
          description: The member's properties in the organization, read by a condition as `subject.attrs`. At most 4096 bytes of JSON.
          example:
            branch: north
    IssuedTokenPair:
      type: object
      description: A fresh access and refresh token.
      properties:
        access_token:
          type: string
          description: JWT RS256 access token.
        refresh_token:
          type: string
          description: Opaque refresh token.
        persistent:
          type: boolean
          description: 'Whether the session is a long one ("keep me signed in"): 30 days without use, 90 in all. false: 12 hours at most.'
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        token_type:
          type: string
          enum:
            - Bearer
    ConsentPurposeDefinition:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
    LegalDocumentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - terms
            - privacy
        version:
          type: string
        url:
          type: string
          format: uri
        system:
          type: string
          description: The client system it applies to; absent for the workspace's.
        published_at:
          type: string
          format: date-time
    SignupLegalInfo:
      type: object
      description: What a sign-up form must show and ask.
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocumentSummary'
        consent_purposes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentPurposeDefinition'
    SignupModeInfo:
      type: object
      description: How the asking application's system takes sign-ups.
      properties:
        mode:
          type: string
          enum:
            - organization
            - account
            - invite_only
        organization:
          type: object
          properties:
            ask:
              type: boolean
              description: The form asks for the company's name.
            required:
              type: boolean
    PublicAuthSettings:
      type: object
      properties:
        password_policy:
          allOf:
            - $ref: '#/components/schemas/PasswordPolicy'
          description: What a new password must be, for a form to say it and check it before it is sent.
        allow_signup:
          type: boolean
        confirm_email:
          type: boolean
        mfa_required:
          type: boolean
          description: Every sign-in takes a second step.
        signup:
          allOf:
            - $ref: '#/components/schemas/SignupModeInfo'
          description: Present only when an application of a client system asks.
        verify_grace_days:
          type: integer
          description: Days a new account works before its address must be confirmed.
        allow_manual_linking:
          type: boolean
        allow_magic_link:
          type: boolean
        passkey_domain:
          type: string
          description: '"" for the deployment''s domain.'
        captcha_site_key:
          type: string
          description: Turnstile site key; "" when the workspace asks no challenge.
        captcha_enabled:
          type: boolean
        phone_channels:
          type: array
          items:
            type: string
            enum:
              - sms
              - whatsapp
        persistent_sessions:
          type: boolean
          description: Whether the workspace lets people stay signed in. A sign-in screen shows its "keep me signed in" box only when true.
        allow_anonymous:
          type: boolean
        anonymous_ttl_days:
          type: integer
        allow_push:
          type: boolean
        expo_access_token_set:
          type: boolean
          description: Always false here.
        jurisdiction:
          type: string
        erasure_grace_hours:
          type: integer
          description: Always 0 here.
        erasure_delete_days:
          type: integer
          description: Always 0 here.
        audit_retention_days:
          type: integer
          description: Always 0 here.
        consent_purposes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentPurposeDefinition'
        legal:
          allOf:
            - $ref: '#/components/schemas/SignupLegalInfo'
          description: Absent when the workspace asks nothing.
    ClientLookFont:
