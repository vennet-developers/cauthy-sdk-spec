  /v1/auth/anonymous:
    post:
      tags:
        - Guests
      summary: Start a guest session
      description: |
        Creates a guest account and signs it in. Only when the workspace allows anonymous
        sessions. Limited to 10 guests per client IP per hour and 10,000 guests per workspace.
        The refresh token is also set in the httpOnly `cauthy_rt` cookie. When the workspace
        requires a CAPTCHA, the Turnstile answer goes in `X-Captcha-Token`.
      operationId: guestSignIn
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Captcha-Token
          in: header
          required: false
          description: Cloudflare Turnstile answer, when the workspace asks for one.
          schema:
            type: string
      responses:
        '200':
          description: Guest session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionLoginResult'
        '403':
          description: '`anonymous_disabled` (workspace gives no guest sessions), `captcha_required`, `captcha_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: '`rate_limited` (too many guests from this IP; `Retry-After: 3600`) or `too_many_guests` (workspace is full)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`captcha_unavailable` — the CAPTCHA could not be checked'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/anonymous/upgrade:
    post:
      tags:
        - Guests
      summary: Turn a guest into an account
      description: |
        Gives the guest an email and password; the user id stays the same. Returns a new
        session for the account. When the workspace confirms addresses, a confirmation email
        is sent and the account gets the workspace's grace period (at least one day) to confirm.
      operationId: guestUpgrade
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestUpgradeRequest'
      responses:
        '200':
          description: Account created from the guest; new session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionLoginResult'
        '400':
          description: '`bad_request` (malformed body), `validation_error` (`email` invalid), `weak_password`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`signups_disabled` — the workspace accepts no new accounts; `password_disabled` — the workspace takes no password (become an account through a provider instead)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`not_anonymous` (session already belongs to an account) or `email_taken`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/anonymous/upgrade/{provider}:
    get:
      tags:
        - Guests
      summary: Start a guest upgrade with a provider
      description: |
        Answers the provider URL to send the browser to, so the guest becomes the account of
        the address the provider vouches for. `redirect_uri` must be a page of one of the
        application's allowed origins (or the page named in `X-Cauthy-Link-To` by an active
        client in `X-Cauthy-Client-Id`).
      operationId: guestUpgradeSocialStart
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: provider
          in: path
          required: true
          description: Social provider id (e.g. `google`).
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description: Where the provider sends the browser back.
          schema:
            type: string
            format: uri
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          description: Client id of an active application of this workspace.
          schema:
            type: string
        - name: X-Cauthy-Link-To
          in: header
          required: false
          description: The application's own callback page, on one of the client's registered origins.
          schema:
            type: string
      responses:
        '200':
          description: Provider URL to redirect to
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SocialRedirect'
        '400':
          description: '`validation_error` (`redirect_uri` missing), `invalid_redirect_uri`, `invalid_state`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`signups_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`provider_not_configured`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`not_anonymous` — the session already belongs to an account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: '`social_login_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: '`provider_unavailable` — the provider answers with a form POST this server cannot receive'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/anonymous/upgrade/{provider}/callback:
    get:
      tags:
        - Guests
      summary: Finish a guest upgrade with a provider
      description: |
        Trades the provider's code: the guest becomes the account of the provider's address
        (same user id) and gets that account's session. An address that already has an
        account here links nothing (409 `email_taken`).
      operationId: guestUpgradeSocialFinish
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          description: Authorization code from the provider.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: The `state` returned by the start call.
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          description: The same `redirect_uri` used to start the flow.
          schema:
            type: string
      responses:
        '200':
          description: Account created from the guest; new session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionLoginResult'
        '400':
          description: '`validation_error` (`code` missing), `provider_no_email`, `invalid_state`, `invalid_redirect_uri`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`signups_disabled`, `user_suspended`, `email_not_confirmed`, `risk_blocked`, `sso_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`provider_not_configured`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`not_anonymous`, `email_taken`, `provider_already_linked`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: '`social_login_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/google/one-tap:
    post:
      tags:
        - FederatedSignIn
      summary: Sign in with a Google One Tap credential
      description: |
        Trades the ID token the One Tap prompt gave the page for a session. The
        nonce from `begin` makes it good once. Sets the `cauthy_rt` refresh cookie.
      operationId: signInWithGoogleOneTap
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  description: The Google ID token from the prompt.
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: '`cauthy_rt` refresh cookie.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedTokenPair'
        '400':
          description: Malformed body (`bad_request`) or `credential` missing (`required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credential already used or from another prompt, or not valid (`invalid_token`); `issuer_not_trusted`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`email_not_verified`, `email_verification_required`, `signups_disabled`, `account_not_active`, or `sso_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The workspace has no Google sign-in configured (`one_tap_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The token carries no email claim (`email_required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/google/one-tap/begin:
    post:
      tags:
        - FederatedSignIn
      summary: Start a Google One Tap prompt
