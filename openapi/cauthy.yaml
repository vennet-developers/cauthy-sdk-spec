  /v1/auth/me/password:
    post:
      tags:
        - Account
      summary: Change my password
      description: |
        Changes the password given the current one. That ends every session of the
        account, so the answer carries fresh tokens for the caller; if they could
        not be issued the password still changed and the answer is `204`.
      operationId: changeMyPassword
      x-cauthy-flow: false
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed; new tokens for this caller
          headers:
            Set-Cookie:
              description: '`cauthy_rt` refresh cookie, as on every route that issues tokens.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedTokenPair'
        '204':
          description: Password changed; sign in again
        '400':
          description: '`new_password` missing (`required`) or refused by the workspace''s password policy (`weak_password`, failed rules in `meta.reasons`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid token, or the current password is wrong (`wrong_password`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
