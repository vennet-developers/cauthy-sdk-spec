              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/magic-link/request:
    post:
      tags:
        - MagicLink
      summary: Email a sign-in link and code
      description: |
        Always answers `202`, whether or not the address has an account
        (anti-enumeration). When the request names an application
        (`X-Cauthy-Client-Id`) and one of its registered pages (`X-Cauthy-Link-To`),
        the link opens on that page and `create_account` may make an account for an
        unknown address once the link or code is used; otherwise the link uses
        `redirect_to`. Guarded by the workspace's Turnstile challenge when it has one.
      operationId: requestMagicLink
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: X-Captcha-Token
          in: header
          required: false
          schema:
            type: string
          description: Answer to the workspace's Turnstile challenge, when it asks one.
        - name: X-Cauthy-Client-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Cauthy-Link-To
          in: header
          required: false
          schema:
            type: string
            format: uri
          description: A page of the application (same origin as one of its redirect URIs, no fragment) where the link opens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                redirect_to:
                  type: string
                  format: uri
                  description: Where the link sends the person (when no application page is named).
                create_account:
                  type: boolean
                  description: 'Only with an application page: make an account for an unknown address, if the workspace accepts sign-ups.'
      responses:
        '202':
          description: Accepted (sent if the address may sign in)
        '400':
          description: Malformed body (`bad_request`) or `redirect_to` not allowed (`invalid_redirect`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`magic_link_disabled` (the workspace''s `allow_magic_link` is off), `sso_required` (with `meta.connection`), `captcha_required` or `captcha_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The challenge could not be checked (`captcha_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/magic-link/verify:
    post:
      tags:
        - MagicLink
      summary: Sign in with a magic-link token
      description: |
        Redeems the link's token once and issues tokens. Also sets the `cauthy_rt`
        httpOnly refresh cookie.
      operationId: verifyMagicLink
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The token from the link.
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: '`cauthy_rt` refresh cookie.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedTokenPair'
        '400':
          description: Malformed body or missing token (`bad_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`magic_link_disabled` (the workspace''s `allow_magic_link` is off, a link mailed before included) or `sso_required` (the address must sign in through SSO)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: The link is invalid, expired or used (`invalid_token`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/magic-link/verify-code:
    post:
      tags:
        - MagicLink
      summary: Sign in with the emailed code
      description: |
        For a person who reads the mail on another device: the code sent beside the
        sign-in link. Like `verify`, it sets the `cauthy_rt` refresh cookie.
      operationId: verifyMagicLinkCode
      x-cauthy-flow: false
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: '`cauthy_rt` refresh cookie.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedTokenPair'
        '400':
          description: Malformed body, or email or code missing (`bad_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Wrong or expired code (`invalid_code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`magic_link_disabled` (the workspace''s `allow_magic_link` is off, a link mailed before included) or `sso_required` (the address must sign in through SSO)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
