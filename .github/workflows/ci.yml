name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: conformance/go.mod
          cache-dependency-path: conformance/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: the embedded route table equals protocol/routes.yaml
        run: cmp ../protocol/routes.yaml internal/routes/routes.yaml
      - name: openapi/auth-bff.yaml is up to date
        run: |
          go run ./cmd/gen-openapi ../protocol/routes.yaml "$RUNNER_TEMP/auth-bff.yaml"
          diff -u ../openapi/auth-bff.yaml "$RUNNER_TEMP/auth-bff.yaml"
      - name: vectors are up to date
        run: |
          go run ./cmd/gen-vectors ../vectors/keys "$RUNNER_TEMP"
          diff -u ../vectors/jwks.json "$RUNNER_TEMP/jwks.json"
          diff -u ../vectors/tokens.json "$RUNNER_TEMP/tokens.json"
      - name: vectors/cauthy-key.json is generated from the reference
        run: |
          go run ./cmd/gen-key-vectors ../vectors
          git diff --exit-code ../vectors/cauthy-key.json
      - name: the route table has 75 routes
        run: test "$(grep -c '^  - { id:' ../protocol/routes.yaml)" = 75
  vectors-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: cauthy-auth 0.42.0 runs the vectors (findings are reported, not failed)
        run: |
          npm install --prefix "$RUNNER_TEMP/sdk" --ignore-scripts --no-audit --no-fund cauthy-auth@0.42.0 jose@5.10.0
          CAUTHY_AUTH_DIR="$RUNNER_TEMP/sdk/node_modules/cauthy-auth" VECTORS_REPORT="$RUNNER_TEMP/findings.json" \
            node --test vectors/verify.test.mjs
      - name: the committed report matches the run
        run: diff -u conformance/reports/cauthy-auth-0.42.0.vectors.json "$RUNNER_TEMP/findings.json"
      - name: CAUTHY_KEY vectors agree with WebCrypto
        run: node --test vectors/cauthy-key.test.mjs
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: openapi/cauthy.yaml is valid OpenAPI
        run: npx --yes @redocly/cli@2.71.0 lint --config openapi/redocly.yaml openapi/cauthy.yaml
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: conformance/go.mod
          cache-dependency-path: conformance/go.sum
      - name: go/cauthyapi/types.gen.go is the document's
        working-directory: conformance
        run: |
          go run ./cmd/gen-apitypes ../openapi/cauthy.yaml "$RUNNER_TEMP/types.gen.go"
          diff -u ../go/cauthyapi/types.gen.go "$RUNNER_TEMP/types.gen.go"
      - name: the Go types module builds, with the standard library only
        working-directory: go
        run: go vet ./... && go test ./... && test ! -f go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: '@cauthyhq/spec is the documents'' types'
        working-directory: packages/spec
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          git diff --exit-code -- .
          npm run typecheck
