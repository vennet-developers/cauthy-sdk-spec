name: release
on:
  push:
    tags: ['spec/v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment asks Ivan to approve every run.
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/spec
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: the tag is the package's version
        run: test "spec/v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: the types are the documents'
        run: npm run generate && git diff --exit-code -- .
      - run: npm run typecheck
      - name: npm that publishes through trusted publishing (OIDC, no token)
        run: npm install -g npm@11.19.1
      - run: npm publish --provenance --access public
